name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: skills/logo-creation

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest tests -q

  self-check:
    name: tools run clean against the bundled example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Demo set regenerates reproducibly
        run: |
          python examples/demo/make_demo.py
          git diff --exit-code -- examples/demo || {
            echo "::error::examples/demo is out of sync with make_demo.py"
            exit 1
          }

      - name: Validator passes on the example
        run: python scripts/validate_svg.py examples/demo

      - name: Contact sheet builds
        run: |
          python scripts/build_contact_sheet.py examples/demo --name "Demo" --out /tmp/sheet.html
          test -s /tmp/sheet.html

      - name: Brand kit packages, and does so reproducibly
        run: |
          python scripts/package_brand.py examples/demo --name "Demo" --out /tmp/a.zip
          python scripts/package_brand.py examples/demo --name "Demo" --out /tmp/b.zip
          cmp /tmp/a.zip /tmp/b.zip || {
            echo "::error::brand.zip is not byte-reproducible"
            exit 1
          }

      - name: PNG export works end to end
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          bash scripts/export.sh examples/demo/icon-color.svg /tmp/png-out/
          test -s /tmp/png-out/logo-16.png
          test -s /tmp/png-out/logo-2048.png

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check scripts tests examples
      - name: lint repo-root tooling too
        working-directory: .
        run: ruff check check_manifests.py

  plugin-manifest:
    name: plugin + marketplace manifests are valid and skill frontmatter parses
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - name: plugin.json, marketplace.json, and SKILL.md frontmatter are valid
        # Same script contributors run locally, so CI and local can't drift.
        run: python check_manifests.py
      - name: no network probing in the export path
        run: |
          # Probing a package registry at export time adds a network round trip
          # to every run and resolves whatever currently occupies that name.
          # Match invocations, not prose, so the rule can still be documented.
          if grep -rnE '^[^#]*\bnpx[[:space:]]' --include='*.sh' skills/; then
            echo "::error::export path must detect local binaries, not probe a registry"
            exit 1
          fi
          echo "no network probing in export path"
      - name: export.sh is syntactically valid
        run: bash -n skills/logo-creation/scripts/export.sh
